# Optional OSV dependency scan for Gradle lock / catalog pins (network CVE sweep).
# Complements Dependabot weekly gradle updates.
name: OSV dependency scan

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "gradle/libs.versions.toml"
      - "**/build.gradle.kts"
      - ".github/workflows/osv-scan.yml"

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./
        continue-on-error: true
