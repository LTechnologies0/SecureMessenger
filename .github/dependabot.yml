version: 2
updates:
  # Weekly Gradle so network/crypto CVEs (e.g. Netty) surface quickly.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: scope
    groups:
      gradle-all:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci/cd
